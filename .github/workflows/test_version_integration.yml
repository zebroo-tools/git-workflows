name: Verify version integration
on:
  pull_request:
  push:
    branches: [v9.19]
permissions:
  contents: read
jobs:
  isolated-git-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pyyaml
      - run: python tests/test_version_integration.py
