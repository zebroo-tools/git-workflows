# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Run Robotests for repository

permissions: write-all

on:
  workflow_call:
    inputs:
      projectname:
        type: string
        required: true
      enabled:
        required: false
        type: boolean
        default: true
      timeout:
        required: false
        type: number
        default: 140
      testfile:
        required: false
        type: string
      retries:
        required: false
        type: number
        default: 3
        description: "Number of retry attempts for flaky tests"
      shared_dir:
        required: false
        type: string
        description: "Path to shared directory with prepared database dump"

jobs:
  build:

    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: preparation steps
        uses: zebroo-tools/git-workflows/actions/prepare_repo@v9.19
        with:
          build: ${{ inputs.enabled }}
          enabled: ${{ inputs.enabled }}
          project_name_prefix: ${{ inputs.projectname}}_robotests
          cached_sources_dir: ${{ inputs.shared_dir && format('{0}/sources/{1}', inputs.shared_dir, github.sha) || '' }}

      - name: run robo tests for (if empty then all) ${{ inputs.testfile }}
        if: ${{ inputs.enabled }}
        shell: bash -l {0}
        run: |
          set -x
          echo "Version Robo 1.0"
          cd "$GITHUB_WORKSPACE"
          # Der Monitoring-Stack (grafana/prometheus/loki/alloy/cadvisor + exporter)
          # wird fuer Testlaeufe nicht gebraucht und macht ~9 von 17 Containern je
          # Instanz aus; die loki-/prometheus-Volumes waren der groesste Platzfresser
          # auf dem Runner.
          ./odoobin setting -R RUN_DASHBOARD=0
          MAX_RETRIES=${{ inputs.retries }}
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "::group::Attempt $attempt of $MAX_RETRIES"
            if [[ ! -z "${{ inputs.testfile }}" ]]; then
              if [[ ! -z "${{ inputs.shared_dir }}" ]]; then
                echo "Restoring database from prepared dump"
                ./odoobin setting -R RUN_CRONJOBSHELL=1
                ./odoobin -f reload --demo
                ./odoobin -f restore odoo-db "${{ inputs.shared_dir }}/${{ github.sha }}.dump.gz" --no-dev-scripts
                ./odoobin robot run "${{ inputs.testfile}}" --timeout ${{ inputs.timeout }} && { echo "::endgroup::"; echo "Tests passed on attempt $attempt"; exit 0; }
              else
                ./odoobin -f reload --demo
                ./odoobin -f db reset
                ./odoobin -f robot run "${{ inputs.testfile}}" --timeout ${{ inputs.timeout }} && { echo "::endgroup::"; echo "Tests passed on attempt $attempt"; exit 0; }
              fi
            else
              echo "Testing all files"
              ./odoobin -f robot run-all --timeout ${{ inputs.timeout }} && { echo "::endgroup::"; echo "Tests passed on attempt $attempt"; exit 0; }
            fi
            echo "::endgroup::"
            echo "::warning::Attempt $attempt failed. $([ $attempt -lt $MAX_RETRIES ] && echo 'Retrying...' || echo 'No more retries.')"
          done
          echo "::error::All $MAX_RETRIES attempts failed."
          exit 1

      - name: cleanup docker
        if: always()
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          if "${{ inputs.enabled }}"; then
            ./odoobin -f kill || true
            ./odoobin -f down -v --cleanup-files  || true
          fi