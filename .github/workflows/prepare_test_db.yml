# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Prepare test database

permissions: write-all

on:
  workflow_call:
    inputs:
      projectname:
        type: string
        required: true
      enabled:
        required: false
        type: boolean
        default: true
      timeout:
        required: false
        type: number
        default: 60
      extra_modules:
        type: string
        required: false
        default: "sale_stock stock stock_account"
        description: "Additional modules to install on top of MANIFEST['install'] (e.g. 'robot_utils crm sale_management')"
      uninstall_modules:
        type: string
        required: false
        description: "Space-separated modules to uninstall before backup (e.g. 'partner_autocomplete')"
      shared_dir:
        type: string
        required: true
        description: "Path to shared directory for storing the database dump"

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: preparation steps
        uses: zebroo-tools/git-workflows/actions/prepare_repo@v9.19
        with:
          build: ${{ inputs.enabled }}
          enabled: ${{ inputs.enabled }}
          project_name_prefix: ${{ inputs.projectname }}_prepare_db
          cached_sources_dir: ${{ inputs.shared_dir }}/sources/${{ github.sha }}

      - name: prepare database
        if: ${{ inputs.enabled }}
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          ./odoobin setting -R RUN_CRONJOBSHELL=1
          ./odoobin setting -R DEVMODE=1
          ./odoobin setting -R RUN_PROXY_PUBLISHED=0
          ./odoobin -f reload --demo
          ./odoobin build > /dev/null 2>&1
          ./odoobin -f db reset
          MODULES=$(python3 -c "from pathlib import Path; print(' '.join(eval(Path('MANIFEST').read_text())['install']))")
          MODULES="$MODULES ${{ inputs.extra_modules }}"
          echo "Installing modules: $MODULES"
          ./odoobin update $MODULES > /dev/null 2>&1
          echo "Update done. Log available at /update.log"
          if [[ ! -z "${{ inputs.uninstall_modules }}" ]]; then
            echo "Uninstalling modules: ${{ inputs.uninstall_modules }}"
            ./odoobin uninstall ${{ inputs.uninstall_modules }}
          fi
          mkdir -p "${{ inputs.shared_dir }}"
          ./odoobin backup odoo-db "${{ inputs.shared_dir }}/${{ github.sha }}.dump.gz"

      - name: cleanup old dumps
        if: always()
        shell: bash -l {0}
        run: |
          find "${{ inputs.shared_dir }}" -name "*.dump.gz" -mtime +3 -delete || true

      - name: cleanup docker
        if: always()
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          if "${{ inputs.enabled }}"; then
            ./odoobin -f kill || true
            ./odoobin -f down -v --cleanup-files || true
          fi
