# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Prepare test database

permissions: write-all

on:
  workflow_call:
    inputs:
      projectname:
        type: string
        required: true
      enabled:
        required: false
        type: boolean
        default: true
      timeout:
        required: false
        type: number
        default: 60
      extra_modules:
        type: string
        required: false
        default: "sale_stock stock stock_account"
        description: "Additional modules to install on top of MANIFEST['install'] (e.g. 'robot_utils crm sale_management')"
      uninstall_modules:
        type: string
        required: false
        description: "Space-separated modules to uninstall before backup (e.g. 'partner_autocomplete')"
      shared_dir:
        type: string
        required: true
        description: "Path to shared directory for storing the database dump"

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: preparation steps
        uses: zebroo-tools/git-workflows/actions/prepare_repo@v9.19
        with:
          build: ${{ inputs.enabled }}
          enabled: ${{ inputs.enabled }}
          project_name_prefix: ${{ inputs.projectname }}_prepare_db
          cached_sources_dir: ${{ inputs.shared_dir }}/sources/${{ github.sha }}

      - name: prepare database
        if: ${{ inputs.enabled }}
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          ./odoobin setting -R RUN_CRONJOBSHELL=1
          ./odoobin setting -R DEVMODE=1
          ./odoobin setting -R RUN_PROXY_PUBLISHED=0
          # siehe robotests.yml: Monitoring-Stack in Testlaeufen abschalten
          ./odoobin setting -R RUN_DASHBOARD=0
          ./odoobin -f reload --demo
          ./odoobin build > /dev/null 2>&1
          ./odoobin -f db reset
          MODULES=$(python3 -c "from pathlib import Path; print(' '.join(eval(Path('MANIFEST').read_text())['install']))")
          MODULES="$MODULES ${{ inputs.extra_modules }}"
          echo "Installing modules: $MODULES"
          if ! ./odoobin update $MODULES > update_run.log 2>&1; then
            echo "::error::Module update failed - last 150 lines of the log follow"
            tail -n 150 update_run.log
            exit 1
          fi
          echo "Update done. Log available at /update.log"
          # Cross-check: a green exit code alone is not enough. If a module
          # blows up during install, the update can still end quietly and we
          # would back up a half-built database - the robot tests then fail
          # later on with missing menus instead of the real error.
          INSTALLED=$(echo "SELECT name FROM ir_module_module WHERE state = 'installed';" \
            | ./odoobin psql 2>/dev/null | tr -d ' ')
          if [ -z "$INSTALLED" ]; then
            echo "::error::Could not read the module list from the database."
            tail -n 150 update_run.log
            exit 1
          fi
          MISSING=""
          for module in $MODULES; do
            echo "$INSTALLED" | grep -qx "$module" || MISSING="$MISSING $module"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Requested but not installed:$MISSING"
            echo "--- last 150 lines of the update log ---"
            tail -n 150 update_run.log
            exit 1
          fi
          echo "All $(echo $MODULES | wc -w) requested modules are installed."
          if [[ ! -z "${{ inputs.uninstall_modules }}" ]]; then
            echo "Uninstalling modules: ${{ inputs.uninstall_modules }}"
            ./odoobin uninstall ${{ inputs.uninstall_modules }}
          fi
          mkdir -p "${{ inputs.shared_dir }}"
          ./odoobin backup odoo-db "${{ inputs.shared_dir }}/${{ github.sha }}.dump.gz"

      - name: cleanup old dumps
        if: always()
        shell: bash -l {0}
        run: |
          find "${{ inputs.shared_dir }}" -name "*.dump.gz" -mtime +3 -delete || true

      - name: cleanup docker
        if: always()
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          if "${{ inputs.enabled }}"; then
            ./odoobin -f kill || true
            ./odoobin -f down -v --cleanup-files || true
          fi
