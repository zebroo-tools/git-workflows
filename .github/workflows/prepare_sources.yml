# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Prepare sources (gimera apply + cache)

permissions: write-all

on:
  workflow_call:
    inputs:
      enabled:
        required: false
        type: boolean
        default: true
      timeout:
        required: false
        type: number
        default: 30
      shared_dir:
        type: string
        required: true
        description: "Path to shared directory for caching sources"

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: fetch missing repos (gimera)
        if: ${{ inputs.enabled }}
        shell: bash -l {0}
        env:
          GIMERA_NON_THREADED: 1
          GIMERA_NON_INTERACTIVE: 1
          GIMERA_NO_PRECOMMIT: 1
        run: |
          set -ex
          cd "$GITHUB_WORKSPACE"
          which gimera
          echo "::group::gimera"

          rm .gitignore

          max_attempts=10
          attempt=1
          random_wait_time=$(( (RANDOM % 30) + 1 ))

          # always update robots
          rm -Rf addons_robot || true

          # remove pre commit config
          rm .pre-commit-config.yaml || true
          git add .pre-commit-config.yaml || true
          git commit -m 'removed precommit'

          while (( attempt <= max_attempts ))
          do
              if gimera apply -f -r -C -v -P -I; then
                echo "Success on attempt $attempt! Congrats."
                break
              else
                echo "Failure on attempt $attempt."
              fi
              ((attempt++))
              sleep "$random_wait_time"
          done
          echo "::endgroup::"
          echo "Finished gimera apply"

      - name: checkout matching submodule branches for feature branches
        if: ${{ inputs.enabled }}
        shell: bash {0}
        run: |
          set -ex
          cd "$GITHUB_WORKSPACE"
          current_branch="${GITHUB_REF#refs/heads/}"

          # skip for version branches (19.0, 18.0, ...) and main
          if python -c "float('$current_branch')" 2>/dev/null || [ "$current_branch" = "main" ]; then
            echo "Version or main branch - skipping submodule branch checkout"
            exit 0
          fi

          # for each submodule, try to checkout the matching branch
          git submodule foreach --quiet '
            if git ls-remote --heads origin "'"$current_branch"'" | grep -q "'"$current_branch"'"; then
              echo "Checking out submodule $name branch: '"$current_branch"'"
              git fetch origin "'"$current_branch"'"
              git checkout "'"$current_branch"'"
            else
              echo "No matching branch for $name: '"$current_branch"'"
            fi
          '

      - name: cache sources to shared dir
        if: ${{ inputs.enabled }}
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          CACHE_DIR="${{ inputs.shared_dir }}/sources/${{ github.sha }}"
          mkdir -p "$CACHE_DIR"
          rsync -a --delete --exclude='.git' ./ "$CACHE_DIR/"
          echo "Sources cached to $CACHE_DIR"

      - name: cleanup old source caches
        if: always()
        shell: bash -l {0}
        run: |
          find "${{ inputs.shared_dir }}/sources" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} + || true
