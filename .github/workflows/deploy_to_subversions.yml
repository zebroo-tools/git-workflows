# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Prepare reviewed version integration

on:
  workflow_call:
    inputs:
      branches:
        required: true
        type: string
        # is an array like:
        # '15.0:main 16.0:main ||| 14.0:15.0'
      runner_label:
        required: false
        type: string
        default: "self-hosted"
        
    secrets:
      SSH_PRIVATE_KEY:
        required: true

# Git pushes use SSH; the token only reads contents and opens conflict issues.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:

    runs-on: ${{ inputs.runner_label || 'self-hosted' }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: setup ssh
      run: |
        mkdir -p ~/.ssh || exit 0
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa
        chmod 500 ~/.ssh
        cat .git/config

    - name: setup default name / email
      run: |
        username="github-action@github.com"
        git config --global user.email "${username}"
        git config --global user.name "${username}"
        git remote set-url origin "git@github.com:${{ github.repository }}.git"

    - name: Prepare integration script
      shell: bash
      run: |
        cat <<'EOF' > /tmp/integrate.sh
        #!/bin/bash
        set -euo pipefail
        SOURCE="$1"
        DEST="$2"
        git check-ref-format --branch "$SOURCE" >/dev/null
        git check-ref-format --branch "$DEST" >/dev/null
        git fetch origin "+refs/heads/$SOURCE:refs/remotes/origin/$SOURCE" "+refs/heads/$DEST:refs/remotes/origin/$DEST"
        source_ref="refs/remotes/origin/$SOURCE"
        dest_ref="refs/remotes/origin/$DEST"
        if git merge-base --is-ancestor "$source_ref" "$dest_ref"; then
          echo "Source already integrated into destination"
          exit 0
        fi
        source_sha="$(git rev-parse "$source_ref")"
        branch="automation/version-sync-${SOURCE//\//-}-to-${DEST//\//-}-${source_sha:0:12}"
        git checkout --detach "$dest_ref"
        if ! git merge --no-ff --no-edit "$source_ref"; then
          git merge --abort
          gh issue create --title "$SOURCE branch was updated - needs to deploy the changes to: $DEST" \
            --body "Automatic integration has merge conflicts. Prepare a reviewed resolution; no destination history was changed." || true
          exit 1
        fi
        if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          git merge-base --is-ancestor "$source_ref" "refs/remotes/origin/$branch"
          git merge-base --is-ancestor "$dest_ref" "refs/remotes/origin/$branch"
        else
          git push origin "HEAD:refs/heads/$branch"
        fi
        existing="$(gh pr list --head "$branch" --base "$DEST" --state open --json number --jq 'length')"
        if [[ "$existing" == "0" ]]; then
          gh pr create --head "$branch" --base "$DEST" \
            --title "Integrate $SOURCE into $DEST" \
            --body "Merge integration preserving both histories. Review framework compatibility and run target-version tests before merging. Source: $source_sha."
        fi
        EOF

    - name: Prepare integration PRs; fail on conflicts or rejected pushes
      shell: bash
      env:
        BRANCH_MAPPINGS: ${{ inputs.branches }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        failed=0
        # Independent groups continue after a failure, but the job stays failed.
        while IFS= read -r area; do
          for mapping in $area; do
            if [[ "$mapping" != *:* || "$mapping" == *:*:* ]]; then
              echo "Invalid branch mapping"
              failed=1
              break
            fi
            dest="${mapping%%:*}"
            source="${mapping#*:}"
            if ! bash /tmp/integrate.sh "$source" "$dest"; then
              failed=1
              break
            fi
          done
        done < <(printf '%s\n' "$BRANCH_MAPPINGS" | sed 's/|||/\n/g')
        exit "$failed"
