# https://docs.github.com/en/actions/using-workflows/reusing-workflows
name: Run Unittests for repository

permissions: write-all

on:
  workflow_call:
    inputs:
      projectname:
        type: string
        required: true
      enabled:
        required: true
        type: string
      testfile:
        type: string
        required: false
      timeout:
        type: number
        required: false
        default: 20
      retries:
        required: false
        type: number
        default: 3
        description: "Number of retry attempts for flaky tests"
      shared_dir:
        required: false
        type: string
        description: "Path to shared directory with cached sources"

jobs:
  run_tests:
    runs-on:
      - self-hosted
      # - marc-laptop

    timeout-minutes: ${{ inputs.timeout}}
    steps:
      - name: Welcome robotests
        shell: bash -l {0}
        run: |
          echo "Welcome to unit-testing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: preparation steps
        uses: zebroo-tools/git-workflows/actions/prepare_repo@v9.19
        with:
          enabled: ${{ inputs.enabled }}
          build: ${{ inputs.enabled }}
          project_name_prefix: ${{ inputs.projectname}}_unittests
          cached_sources_dir: ${{ inputs.shared_dir && format('{0}/sources/{1}', inputs.shared_dir, github.sha) || '' }}

      - name: run tests for ${{ inputs.testfile }}
        if: ${{ inputs.enabled }}
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          MAX_RETRIES=${{ inputs.retries }}
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "::group::Attempt $attempt of $MAX_RETRIES"
            if [[ ! -z "${{ inputs.testfile }}" ]]; then
              echo "Running unittest for ${{ inputs.testfile }}"
              ./odoobin -f reload --demo
              ./odoobin -f db reset
              ./odoobin -f up -d postgres
              module=$(dirname "$(dirname "${{ inputs.testfile }}")")
              ./odoobin update "$module" > /dev/null 2>&1
              ./odoobin -f unit "${{ inputs.testfile }}" && { echo "::endgroup::"; echo "Tests passed on attempt $attempt"; exit 0; }
            else
              echo "Testing all files"
              if [ $attempt -gt 1 ]; then
                ./odoobin -f kill || true
                ./odoobin -f down || true
              fi
              ./odoobin up -d postgres || true
              ./odoobin up -d postgres
              ./odoobin -f run-tests && { echo "::endgroup::"; echo "Tests passed on attempt $attempt"; exit 0; }
            fi
            echo "::endgroup::"
            echo "::warning::Attempt $attempt failed. $([ $attempt -lt $MAX_RETRIES ] && echo 'Retrying...' || echo 'No more retries.')"
          done
          echo "::error::All $MAX_RETRIES attempts failed."
          exit 1

      - name: cleanup docker
        if: always()
        shell: bash -l {0}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          if "${{ inputs.enabled }}"; then
            ./odoobin -f kill
            ./odoobin -f down -v --cleanup-files  || true
          fi
